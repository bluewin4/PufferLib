[env]
name = puffer_sequence_learn

[env.kwargs]
num_envs = 1024
reward_rule = 1  ; 0=exact match, 1=partial match, 2=exponential (default: partial for easier learning)
production_rule = 0  ; 0=flat (all available), 1=associative

[policy]
input_size = 6  ; SEQUENCE_LENGTH + 2
hidden_size = 128

[lstm]
enabled = true
hidden_size = 128
num_layers = 2

[train]
num_envs = 1024
env_batch_size = 32
bptt_horizon = 16  ; Important for sequence learning
batch_size = 65536
clip_coef = 0.1
clip_vloss = true
ent_coef = 0.01
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.00025
minibatch_size = 2048
norm_adv = true
num_minibatches = 8
num_steps = 128
update_epochs = 3
vf_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.01
total_timesteps = 10_000_000
save_interval = 100
eval_interval = 100
checkpoint_interval = 0
wandb_project = sequence_learn
wandb_name = sequence_learn
verbose = true
track = true 