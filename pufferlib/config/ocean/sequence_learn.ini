[base]
package = ocean
env_name = puffer_sequence_learn
policy_name = Policy
rnn_name = Recurrent

[env]
reward_rule = 3
production_rule = 0

[vec]
num_envs = 1024
num_workers = 4

[policy]
hidden_size = 128

[lstm]
enabled = true
hidden_size = 128
num_layers = 2

[train]
env_batch_size = 128
bptt_horizon = 16
batch_size = 131072
num_steps = 128
clip_coef = 0.1
clip_vloss = true
ent_coef = 0.01
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.00025
minibatch_size = 16384
norm_adv = true
num_minibatches = 8
update_epochs = 3
vf_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.01
total_timesteps = 10_000_000
save_interval = 100
eval_interval = 100
checkpoint_interval = 1000
wandb_project = sequence_learn
wandb_name = sequence_learn
verbose = true
track = true 